name: Build ABvpn v2.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libgtk-3-dev
          pip install -r requirements.txt pyinstaller
      - name: Build Linux tar.gz
        run: |
          flet pack main.py --name ABvpn
          tar -czvf ABvpn-v2.0-linux-x86_64.tar.gz -C dist ABvpn
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: ABvpn-v2.0-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build Windows exe
        run: |
          flet pack main.py --name ABvpn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/ABvpn.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android Licenses & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          pip install flet-cli flet requests
          flet build apk --project ABvpn --product "ABvpn 2.0" --org "com.abvpn.app" --yes
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk/*.apk

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: ABvpn v2.0.${{ github.run_number }}
          files: |
            artifacts/linux-tar-gz/ABvpn-v2.0-linux-x86_64.tar.gz
            artifacts/windows-exe/ABvpn.exe
            artifacts/android-apk/*.apk
